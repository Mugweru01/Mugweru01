name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["master", "main"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mugweru01
          template: classic
          base: header, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_indepth: no
          plugin_languages_colors: github
          plugin_languages_threshold: 0%
          plugin_lines: yes
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_trim: no
          plugin_notable: yes
          plugin_notable_filter: stars:>100
          plugin_notable_from: all
          plugin_notable_repositories: yes
          plugin_notable_types: commit
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 280
          plugin_people_types: followers, following
          plugin_people_identicons: yes
          plugin_people_shuffle: yes
          plugin_people_thanks: Mugweru01
          plugin_projects: yes
          plugin_projects_limit: 4
          plugin_projects_descriptions: no
          plugin_stars: yes
          plugin_stars_limit: 3
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_pagespeed: yes
          plugin_pagespeed_url: .user.website
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes
          config_timezone: Africa/Nairobi
